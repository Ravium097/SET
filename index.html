<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#111111" />
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('set-theme')==='light'?'light':'dark';}catch{document.documentElement.dataset.theme='dark';}document.querySelector('meta[name="theme-color"]').content=document.documentElement.dataset.theme==='light'?'#F7F7F7':'#111111';</script>
    <script>for(const type of ["gesturestart","gesturechange"])document.addEventListener(type,event=>event.preventDefault(),{passive:false});</script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/favicon.png" />
<title>SET · Training dokumentieren</title>
  </head>
  <body>
    <div id="root"><main style="font:16px -apple-system,sans-serif;color:#172638;background:#f7f7f7;padding:32px;min-height:100vh">
      <h1>SET</h1><p id="startup-status" role="status">Deine Trainings werden geladen …</p>
      <p>Bleibt diese Meldung stehen? Schließe andere SET-Fenster und öffne die Starthilfe. Deine Trainings werden nicht gelöscht.</p>
      <a href="/recovery.html" style="color:#172638;text-decoration:underline">Starthilfe öffnen</a>
      <noscript>Bitte aktiviere JavaScript für SET.</noscript>
    </main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
